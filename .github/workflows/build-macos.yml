name: Build macOS Package (manual re-run)

# macOS builds run automatically inside release.yml as job 4.
# Use this workflow ONLY to re-run a failed macOS build without re-tagging.
#
# Usage:
#   gh workflow run build-macos.yml -f tag=v2.1.0
#   or: GitHub UI → Actions → Build macOS Package (manual re-run) → Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Write VERSION file
        run: echo "${{ github.event.inputs.tag }}" | sed 's/^v//' > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          brew install create-dmg

      - name: Generate icon.icns
        run: |
          ICONSET="packaging/macos/icon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size app/assets/icon.png \
              --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) app/assets/icon.png \
              --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o app/assets/icon.icns
          rm -rf "$ICONSET"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller packaging/macos/steam_grunge_editor_mac.spec \
            --distpath packaging/macos/dist \
            --workpath packaging/macos/build \
            --noconfirm --clean

      - name: Verify .app bundle
        run: |
          APP="packaging/macos/dist/Steam Grunge Editor.app"
          [ -d "$APP" ] || { echo "ERROR: .app not found"; exit 1; }
          echo "OK: $APP"

      - name: Set version in Info.plist
        run: |
          VER=$(cat VERSION)
          PLIST="packaging/macos/dist/Steam Grunge Editor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PLIST"

      - name: Create .dmg
        run: |
          VER=$(cat VERSION)
          DMG="packaging/macos/Steam_Grunge_Editor-${VER}.dmg"
          create-dmg \
            --volname "Steam Grunge Editor $VER" \
            --volicon "app/assets/icon.icns" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 \
            --icon "Steam Grunge Editor.app" 150 185 \
            --hide-extension "Steam Grunge Editor.app" \
            --app-drop-link 450 185 \
            "$DMG" "packaging/macos/dist/" 2>/dev/null || \
          create-dmg \
            --volname "Steam Grunge Editor $VER" \
            --volicon "app/assets/icon.icns" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 \
            --icon "Steam Grunge Editor.app" 150 185 \
            --hide-extension "Steam Grunge Editor.app" \
            --app-drop-link 450 185 \
            "$DMG" "packaging/macos/dist/"
          [ -f "$DMG" ] || { echo "ERROR: .dmg not created"; exit 1; }
          echo "DMG OK: $(du -sh $DMG | cut -f1)"

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} \
            packaging/macos/Steam_Grunge_Editor-*.dmg \
            --clobber