name: Build Windows Installer (manual re-run)

# Windows builds run automatically inside release.yml as job 3.
# Use this workflow ONLY to re-run a failed Windows build without re-tagging.
#
# Usage:
#   gh workflow run build-windows.yml -f tag=v2.1.0
#   or: GitHub UI → Actions → Build Windows Installer (manual re-run) → Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Write VERSION file
        shell: bash
        run: echo "${{ github.event.inputs.tag }}" | sed 's/^v//' > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Convert icon.png to icon.ico
        run: |
          python -c "
          from PIL import Image
          img = Image.open('app/assets/icon.png')
          img.save('app/assets/icon.ico', format='ICO',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('icon.ico created')
          "

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/windows/steam_grunge_editor.spec `
            --noconfirm --clean

      - name: Verify PyInstaller output
        shell: bash
        run: |
          [ -f "dist/SteamGrungeEditor/SteamGrungeEditor.exe" ] || \
            { echo "ERROR: exe not found"; exit 1; }
          echo "EXE OK"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: bash
        run: |
          VER=$(cat VERSION)
          mkdir -p dist/installer
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DAppVersion="$VER" \
            packaging/windows/steam_grunge_editor.iss

      - name: Verify installer
        shell: bash
        run: |
          VER=$(cat VERSION)
          [ -f "dist/installer/SteamGrungeEditor-${VER}-Setup.exe" ] || \
            { echo "ERROR: installer not found"; ls dist/installer/; exit 1; }
          echo "Installer OK"

      - name: Upload to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} \
            dist/installer/SteamGrungeEditor-*-Setup.exe \
            --clobber