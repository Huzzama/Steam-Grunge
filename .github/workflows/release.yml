name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: AppImage + .deb  (Ubuntu 22.04)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Packages (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Write VERSION file
        run: echo "${VERSION#v}" > VERSION

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            debhelper devscripts build-essential \
            imagemagick wget libfuse2 fakeroot dpkg-dev

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          bash packaging/appimage/build-appimage.sh

      - name: Build .deb package
        run: |
          chmod +x packaging/debian/build-deb.sh
          bash packaging/debian/build-deb.sh

      # Upload artifacts so the release job can collect all checksums together
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/appimage/Steam_Grunge_Editor-*.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/debian/steam-grunge-editor_*.deb

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: RPM  (Fedora container — produces correct .fcXX dist tag)
  # ─────────────────────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-22.04
    container:
      image: fedora:41

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Write VERSION file
        run: echo "${VERSION#v}" > VERSION

      - name: Install build tools
        run: dnf install -y rpm-build rpmdevtools python3 python3-pip imagemagick wget

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build PyInstaller binary
        run: |
          pip3 install -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --windowed \
            --name "steam-grunge-editor" \
            --distpath dist/ \
            --add-data "app/assets:assets" \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --collect-all "PySide6" \
            app/main.py

      - name: Build RPM
        run: |
          chmod +x packaging/rpm/build-rpm.sh
          bash packaging/rpm/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/**/*.rpm

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Collect all artifacts, generate checksums, publish release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-rpm]

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist/

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist/

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd dist/
          sha256sum \
            Steam_Grunge_Editor-*.AppImage \
            steam-grunge-editor_*.deb \
            steam-grunge-editor-*.rpm \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt   # visible in CI logs for quick sanity check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Grunge Editor ${{ github.ref_name }}"
          body: |
            ## Steam Grunge Editor ${{ github.ref_name }}

            Create distressed, grunge-style custom artwork for your Steam library.

            ### What's new in v2.0.0

            - 💼 **Project save/load** — `.sgeproj` format (full layer stack + AppState, atomic write, autosave every 5 min)
            - 🔔 **Auto update checker** — notified at launch when a new version is available
            - 🖼️ **Film grain now respects per-layer adjustments** — brightness, contrast, tint, saturation all survive grain being turned up
            - ⚡ **Major performance overhaul** — slider drag no longer freezes canvas; 25%-res preview during drag, cached FX during interaction, vectorised NumPy grain
            - 🖱️ **Bounding box handle jitter fixed** — sub-pixel `QPointF`/`QRectF` transforms replace `int()` truncation
            - 🔑 **API key persisted between sessions** — stored in `settings.json`, loaded automatically on launch
            - 🖼️ **SteamGridDB 401 / broken thumbnails fixed** — CDN URLs no longer send Bearer auth; validity checked via `QPixmap.loadFromData()`
            - 🐛 **Bounding box no longer lost after combo/wheel scroll** — `wheelEvent`/`focusOutEvent` guards added

            See [CHANGELOG.md](https://github.com/Huzzama/Steam-Grunge/blob/main/CHANGELOG.md) for full details.

            ### Downloads

            | File | Platform |
            |------|----------|
            | `Steam_Grunge_Editor-*-x86_64.AppImage` | 🐧 Any Linux distro (universal) |
            | `steam-grunge-editor_*_all.deb` | 🐧 Ubuntu, Mint, Debian, Pop!_OS |
            | `steam-grunge-editor-*.fc41.x86_64.rpm` | 🐧 Fedora, Bazzite, rpm-ostree |
            | `SteamGrungeEditor-*-Setup.exe` | 🪟 Windows 10/11 |
            | `Steam_Grunge_Editor-*.dmg` | 🍎 macOS Big Sur 11.0+ |

            ### Install

            **🐧 AppImage:**
            ```bash
            chmod +x Steam_Grunge_Editor-*-x86_64.AppImage
            ./Steam_Grunge_Editor-*-x86_64.AppImage
            ```
            **🐧 Debian / Ubuntu / Linux Mint:**
            ```bash
            sudo dpkg -i steam-grunge-editor_*_all.deb
            sudo apt-get install -f
            ```
            **🐧 Fedora Workstation:**
            ```bash
            sudo dnf install ./steam-grunge-editor-*.rpm
            ```
            **🐧 Fedora Atomic / Bazzite / Silverblue (rpm-ostree):**
            ```bash
            rpm-ostree install ./steam-grunge-editor-*.rpm
            ```
            **🐧 Arch Linux (AUR):**
            ```bash
            yay -S steam-grunge-editor
            ```
            **🪟 Windows:** Run the `.exe` installer and follow the wizard.

            **🍎 macOS:** Open the `.dmg`, drag to Applications.
            First launch: right-click → Open (bypasses Gatekeeper warning).

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/Steam_Grunge_Editor-*.AppImage
            dist/steam-grunge-editor_*.deb
            dist/steam-grunge-editor-*.rpm
            dist/SHA256SUMS.txt

      - name: Retry release upload if needed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Grunge Editor ${{ github.ref_name }}"
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/Steam_Grunge_Editor-*.AppImage
            dist/steam-grunge-editor_*.deb
            dist/steam-grunge-editor-*.rpm
            dist/SHA256SUMS.txt