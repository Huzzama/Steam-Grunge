name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: AppImage + .deb  (Ubuntu 22.04)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Packages (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Write VERSION file
        run: echo "${VERSION#v}" > VERSION

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            debhelper devscripts build-essential \
            imagemagick wget libfuse2 fakeroot dpkg-dev

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          bash packaging/appimage/build-appimage.sh

      - name: Build .deb package
        run: |
          chmod +x packaging/debian/build-deb.sh
          bash packaging/debian/build-deb.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/appimage/Steam_Grunge_Editor-*.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/debian/steam-grunge-editor_*.deb

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: RPM  (Fedora 41 container)
  #
  # FIX v2.1.0: Fedora 41 introduced a separate debugsource subpackage that
  # rpmbuild generates even for PyInstaller binaries (which have no sources).
  # This causes: "error: Empty %files file ...debugsourcefiles.list"
  #
  # The fix is applied at two levels:
  #   1. The spec file sets both %global debug_package %{nil} AND
  #      %global _enable_debug_packages 0 (spec file is the authoritative fix)
  #   2. The rpmbuild call below passes --define flags as a belt-and-suspenders
  #      guard in case rpmbuild processes globals after the debug subpackage
  #      decision point (observed on fc41 with add-determinism macro).
  # ─────────────────────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM (Fedora 41)
    runs-on: ubuntu-22.04
    container:
      image: fedora:41
    # APP_VERSION must be explicit here — the container does not inherit
    # the top-level env.VERSION automatically in all GitHub Actions versions,
    # and %{getenv:APP_VERSION} in rpm 4.19 / Fedora 41 requires the variable
    # to be present in the rpmbuild process environment, not just as --define.
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Write VERSION file
        run: |
          VER="${VERSION#v}"
          echo "$VER" > VERSION
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "Building RPM version: $VER"

      - name: Install build tools
        run: |
          dnf install -y \
            rpm-build rpmdevtools \
            python3 python3-pip \
            ImageMagick wget

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build PyInstaller binary
        run: |
          pip3 install -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --windowed \
            --name "steam-grunge-editor" \
            --distpath dist/ \
            --add-data "app/assets:assets" \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --collect-all "PySide6" \
            app/main.py

      - name: Build RPM
        run: |
          chmod +x packaging/fedora/build-rpm.sh
          bash packaging/fedora/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/**/*.rpm

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Collect all artifacts, generate checksums, publish release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-rpm]

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist/

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/

      - name: Download RPM
        uses: actions/download-artifact@v4
        with:
          name: rpm
          path: dist/

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd dist/
          sha256sum \
            Steam_Grunge_Editor-*.AppImage \
            steam-grunge-editor_*.deb \
            steam-grunge-editor-*.rpm \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Grunge Editor ${{ github.ref_name }}"
          body: |
            ## Steam Grunge Editor ${{ github.ref_name }}

            Create distressed, grunge-style custom artwork for your Steam library.

            ### What's new in v2.1.0

            #### 🔄 Pro-level post-sync strategy system
            Steam no longer needs to be manually restarted after syncing artwork.

            | Strategy | Behaviour |
            |----------|-----------|
            | `soft` | Touch folders + send `steam://reload/<appid>` *(default)* |
            | `restart` | Full Steam restart — shutdown → settle → relaunch |
            | `auto` | Smart: restarts if ≥ 5 files changed, otherwise soft |
            | `none` | Write files only, no Steam signal |

            #### 🎮 Game-running guard
            Before any restart, the app checks whether a game is running.
            Silent mode falls back to `soft` automatically — no gameplay interruption, ever.
            Detection covers native Linux games, Proton, and uses `SteamAppId` environment inspection as the definitive signal.

            #### 🟦 Steam Deck & Flatpak support
            - Flatpak Steam root path auto-detected
            - Steam IPC pipe checked at both native and Flatpak XDG runtime paths
            - `xdg-open` fallback for `steam://reload` when pipe is unavailable
            - Restart uses `flatpak kill` / `flatpak run` — fixes silent no-op on Steam Deck

            #### ⚡ Batch sync — single post-sync execution
            Bulk sync no longer restarts Steam once per game file. All artwork is written first, then a single signal fires at the end.

            #### 📋 Rotating file logger
            All sync operations logged to `~/.config/steam-grunge-editor/logs/steamSync.log` (1 MB rotating, 3 backups).

            See [CHANGELOG.md](https://github.com/Huzzama/Steam-Grunge/blob/main/CHANGELOG.md) for full details.

            ### Downloads

            | File | Platform |
            |------|----------|
            | `Steam_Grunge_Editor-*-x86_64.AppImage` | 🐧 Any Linux distro (universal) |
            | `steam-grunge-editor_*_all.deb` | 🐧 Ubuntu, Mint, Debian, Pop!_OS |
            | `steam-grunge-editor-*.fc41.x86_64.rpm` | 🐧 Fedora, Bazzite, rpm-ostree |
            | `SteamGrungeEditor-*-Setup.exe` | 🪟 Windows 10/11 |
            | `Steam_Grunge_Editor-*.dmg` | 🍎 macOS Big Sur 11.0+ |

            ### Install

            **🐧 AppImage:**
            ```bash
            chmod +x Steam_Grunge_Editor-*-x86_64.AppImage
            ./Steam_Grunge_Editor-*-x86_64.AppImage
            ```
            **🐧 Debian / Ubuntu / Linux Mint:**
            ```bash
            sudo dpkg -i steam-grunge-editor_*_all.deb
            sudo apt-get install -f
            ```
            **🐧 Fedora Workstation:**
            ```bash
            sudo dnf install ./steam-grunge-editor-*.rpm
            ```
            **🐧 Fedora Atomic / Bazzite / Silverblue (rpm-ostree):**
            ```bash
            rpm-ostree install ./steam-grunge-editor-*.rpm
            ```
            **🐧 Arch Linux (AUR):**
            ```bash
            yay -S steam-grunge-editor
            ```
            **🪟 Windows:** Run the `.exe` installer and follow the wizard.

            **🍎 macOS:** Open the `.dmg`, drag to Applications.
            First launch: right-click → Open (bypasses Gatekeeper warning).

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/Steam_Grunge_Editor-*.AppImage
            dist/steam-grunge-editor_*.deb
            dist/steam-grunge-editor-*.rpm
            dist/SHA256SUMS.txt

      - name: Retry release upload if needed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Grunge Editor ${{ github.ref_name }}"
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/Steam_Grunge_Editor-*.AppImage
            dist/steam-grunge-editor_*.deb
            dist/steam-grunge-editor-*.rpm
            dist/SHA256SUMS.txt