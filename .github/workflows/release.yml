name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: AppImage + .deb  (Ubuntu 22.04)
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Packages (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            debhelper devscripts build-essential \
            imagemagick wget libfuse2 fakeroot dpkg-dev

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          bash packaging/appimage/build-appimage.sh

      - name: Build .deb
        run: |
          chmod +x packaging/debian/build-deb.sh
          bash packaging/debian/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/appimage/Steam_Grunge_Editor-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/debian/steam-grunge-editor_*.deb

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: RPM (Fedora 41 container)
  # ───────────────────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM (Fedora 41)
    runs-on: ubuntu-22.04
    container:
      image: fedora:41
    # PKG_VERSION is evaluated by GitHub Actions BEFORE entering the container,
    # so it is always available as a real env var inside every step.
    # GITHUB_REF_NAME is NOT inherited by Fedora containers — do not use it.
    env:
      PKG_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION file
        run: |
          VER="${PKG_VERSION#v}"
          echo "$VER" > VERSION
          echo "VERSION file: $(cat VERSION)"

      - name: Install build tools
        run: |
          dnf install -y \
            rpm-build rpmdevtools \
            python3 python3-pip \
            ImageMagick wget

      - name: Generate multi-size icons
        run: |
          for size in 16 32 48 64 128 256; do
            mkdir -p packaging/shared/icons/${size}x${size}
            convert app/assets/icon.png -resize ${size}x${size} \
              packaging/shared/icons/${size}x${size}/steam-grunge-editor.png
          done

      - name: Build PyInstaller binary
        run: |
          pip3 install -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --windowed \
            --name "steam-grunge-editor" \
            --distpath dist/ \
            --add-data "app/assets:assets" \
            --hidden-import "PySide6.QtCore" \
            --hidden-import "PySide6.QtGui" \
            --hidden-import "PySide6.QtWidgets" \
            --collect-all "PySide6" \
            app/main.py

      - name: Build RPM
        run: |
          chmod +x packaging/fedora/build-rpm.sh
          bash packaging/fedora/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/**/*.rpm

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Windows installer
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION file
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Convert icon.png to icon.ico
        run: |
          python -c "
          from PIL import Image
          img = Image.open('app/assets/icon.png')
          img.save('app/assets/icon.ico', format='ICO',
                   sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('icon.ico created')
          "

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/windows/steam_grunge_editor.spec `
            --noconfirm --clean

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          mkdir dist\installer 2>nul
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=%GITHUB_REF_NAME:v=% ^
            packaging\windows\steam_grunge_editor.iss

      - name: Generate checksum
        shell: bash
        run: |
          cd dist/installer
          sha256sum SteamGrungeEditor-*-Setup.exe > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/installer/SteamGrungeEditor-*-Setup.exe
            dist/installer/SHA256SUMS-windows.txt

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: macOS .dmg
  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION file
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          brew install create-dmg

      - name: Generate icon.icns
        run: |
          ICONSET="packaging/macos/icon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size app/assets/icon.png \
              --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size*2)) $((size*2)) app/assets/icon.png \
              --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o app/assets/icon.icns
          rm -rf "$ICONSET"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller packaging/macos/steam_grunge_editor_mac.spec \
            --distpath packaging/macos/dist \
            --workpath packaging/macos/build \
            --noconfirm --clean

      - name: Set version in Info.plist
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PLIST="packaging/macos/dist/Steam Grunge Editor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PLIST"

      - name: Create .dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Steam Grunge Editor $VER" \
            --volicon "app/assets/icon.icns" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 \
            --icon "Steam Grunge Editor.app" 150 185 \
            --hide-extension "Steam Grunge Editor.app" \
            --app-drop-link 450 185 \
            "packaging/macos/Steam_Grunge_Editor-${VER}.dmg" \
            "packaging/macos/dist/" 2>/dev/null || \
          create-dmg \
            --volname "Steam Grunge Editor $VER" \
            --volicon "app/assets/icon.icns" \
            --window-pos 200 120 --window-size 600 400 \
            --icon-size 100 \
            --icon "Steam Grunge Editor.app" 150 185 \
            --hide-extension "Steam Grunge Editor.app" \
            --app-drop-link 450 185 \
            "packaging/macos/Steam_Grunge_Editor-${VER}.dmg" \
            "packaging/macos/dist/"

      - name: Generate checksum
        run: |
          cd packaging/macos
          sha256sum Steam_Grunge_Editor-*.dmg > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            packaging/macos/Steam_Grunge_Editor-*.dmg
            packaging/macos/SHA256SUMS-macos.txt

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: Collect everything, generate checksums, publish release
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-rpm, build-windows, build-macos]

    steps:
      - uses: actions/download-artifact@v4
        with: { name: appimage, path: dist/ }

      - uses: actions/download-artifact@v4
        with: { name: deb,      path: dist/ }

      - uses: actions/download-artifact@v4
        with: { name: rpm,      path: dist/ }

      - uses: actions/download-artifact@v4
        with: { name: windows,  path: dist/ }

      - uses: actions/download-artifact@v4
        with: { name: macos,    path: dist/ }

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd dist/
          sha256sum \
            Steam_Grunge_Editor-*.AppImage \
            steam-grunge-editor_*.deb \
            steam-grunge-editor-*.rpm \
            SteamGrungeEditor-*-Setup.exe \
            Steam_Grunge_Editor-*.dmg \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Steam Grunge Editor ${{ github.ref_name }}"
          body: |
            ## Steam Grunge Editor ${{ github.ref_name }}

            Create distressed, grunge-style custom artwork for your Steam library.

            ### What's new in v2.1.0

            - 🔄 **Post-sync strategy system** — `soft` / `restart` / `auto` / `none`
            - 🎮 **Game-running guard** — never interrupts active gameplay before restart
            - 🟦 **Steam Deck & Flatpak support** — full detection, pipe IPC, and restart
            - ⚡ **Batch sync** — single post-sync execution after all jobs complete
            - 📋 **Rotating file logger** — `~/.config/steam-grunge-editor/logs/steamSync.log`

            See [CHANGELOG.md](https://github.com/Huzzama/Steam-Grunge/blob/main/CHANGELOG.md) for full details.

            ### Downloads

            | File | Platform |
            |------|----------|
            | `Steam_Grunge_Editor-*-x86_64.AppImage` | 🐧 Any Linux distro |
            | `steam-grunge-editor_*_amd64.deb` | 🐧 Ubuntu, Debian, Mint |
            | `steam-grunge-editor-*.fc41.x86_64.rpm` | 🐧 Fedora, Bazzite |
            | `SteamGrungeEditor-*-Setup.exe` | 🪟 Windows 10/11 |
            | `Steam_Grunge_Editor-*.dmg` | 🍎 macOS Big Sur 11.0+ |

            ### Install

            **🐧 AppImage:**
            ```bash
            chmod +x Steam_Grunge_Editor-*-x86_64.AppImage
            ./Steam_Grunge_Editor-*-x86_64.AppImage
            ```
            **🐧 Debian/Ubuntu:** `sudo dpkg -i steam-grunge-editor_*_amd64.deb`

            **🐧 Fedora:** `sudo dnf install ./steam-grunge-editor-*.rpm`

            **🐧 Fedora Atomic/Bazzite:** `rpm-ostree install ./steam-grunge-editor-*.rpm`

            **🐧 Arch/Steam Deck:** `yay -S steam-grunge-editor`

            **🪟 Windows:** Run the `.exe` installer.

            **🍎 macOS:** Open `.dmg`, drag to Applications. First launch: right-click → Open.

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/Steam_Grunge_Editor-*.AppImage
            dist/steam-grunge-editor_*.deb
            dist/steam-grunge-editor-*.rpm
            dist/SteamGrungeEditor-*-Setup.exe
            dist/Steam_Grunge_Editor-*.dmg
            dist/SHA256SUMS.txt