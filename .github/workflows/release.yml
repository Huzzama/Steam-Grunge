name: Build and Release

# Push a tag like v3.2.0 → tests → AppImage + .deb, .rpm, Windows installer,
# macOS .dmg (each build starts the app headless with --self-test before it is
# packaged) → one GitHub Release with every file + SHA256SUMS.txt.
# The release notes are the CHANGELOG.md section of that version.
#
#   git tag v3.2.0 && git push origin v3.2.0
#
# "Run workflow" (manual) builds everything and keeps the files as workflow
# artifacts, without publishing a release — handy to test the pipeline.
# A failed platform can be retried with "Re-run failed jobs" on the run page.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:

  # ── 0. tests ───────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: pytest
        env: { QT_QPA_PLATFORM: offscreen }
        run: pytest -q

  # ── 1. AppImage + .deb ─────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage + deb)
    needs: tests
    runs-on: ubuntu-22.04          # oldest supported glibc → runs on most distros
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: System libraries (bundled by PyInstaller, needed by the self-test)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file dpkg-dev libfuse2 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: AppImage
        env: { PYTHON: python }
        run: bash packaging/appimage/build-appimage.sh
      - name: .deb
        env: { PYTHON: python }
        run: bash packaging/debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/appimage/Steam_Grunge_Editor-*.AppImage
            packaging/debian/steam-grunge-editor_*.deb
          if-no-files-found: error

  # ── 2. .rpm (Fedora / Bazzite) ─────────────────────────────────────────────
  build-rpm:
    name: Linux (rpm)
    needs: tests
    runs-on: ubuntu-22.04
    container: { image: 'fedora:41' }
    env:
      REF_NAME: ${{ github.ref_name }}    # GITHUB_REF_NAME isn't passed into containers
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${REF_NAME#v}" > VERSION
      - name: Build tools + Qt runtime libraries
        run: |
          dnf install -y rpm-build python3 findutils tar gzip which \
            mesa-libGL mesa-libEGL fontconfig libxkbcommon libxkbcommon-x11 dbus-libs glib2 \
            xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-renderutil
      - name: .rpm
        run: |
          bash packaging/fedora/build-rpm.sh
          mkdir -p out && find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: out/*.rpm, if-no-files-found: error }

  # ── 3. Windows installer ───────────────────────────────────────────────────
  build-windows:
    name: Windows (installer)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: icon.ico
        run: python -c "from PIL import Image; Image.open('app/assets/icon.png').save('app/assets/icon.ico', sizes=[(s, s) for s in (16, 32, 48, 64, 128, 256)])"
      - name: PyInstaller
        run: pyinstaller packaging/windows/steam_grunge_editor.spec --noconfirm --clean
      - name: Self-test of the built .exe
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SGE_SELFTEST_LOG = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist\SteamGrungeEditor\SteamGrungeEditor.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress | Out-Null
          $ver = (Get-Content VERSION -Raw).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\windows\steam_grunge_editor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/installer/SteamGrungeEditor-*-Setup.exe, if-no-files-found: error }

  # ── 4. macOS .dmg (Apple Silicon) ──────────────────────────────────────────
  build-macos:
    name: macOS (dmg)
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          brew install create-dmg
      - name: icon.icns
        run: |
          ICONSET="packaging/macos/icon.iconset"; mkdir -p "$ICONSET"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size app/assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) app/assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o app/assets/icon.icns && rm -rf "$ICONSET"
      - name: PyInstaller (.app)
        run: |
          pyinstaller packaging/macos/steam_grunge_editor_mac.spec \
            --distpath packaging/macos/dist --workpath packaging/macos/build --noconfirm --clean
      - name: Self-test of the built .app
        run: |
          QT_QPA_PLATFORM=offscreen "packaging/macos/dist/Steam Grunge Editor.app/Contents/MacOS/SteamGrungeEditor" --self-test
      - name: .dmg
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          DMG="packaging/macos/Steam_Grunge_Editor-${VER}-arm64.dmg"
          for attempt in 1 2 3; do            # create-dmg sometimes hits a busy volume
            create-dmg --volname "Steam Grunge Editor $VER" --volicon app/assets/icon.icns \
              --window-pos 200 120 --window-size 600 400 --icon-size 100 \
              --icon "Steam Grunge Editor.app" 150 185 --hide-extension "Steam Grunge Editor.app" \
              --app-drop-link 450 185 "$DMG" packaging/macos/dist/ && break
            rm -f "$DMG"; sleep 5
          done
          test -f "$DMG"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: packaging/macos/Steam_Grunge_Editor-*.dmg, if-no-files-found: error }

  # ── 5. GitHub Release (tags only) ──────────────────────────────────────────
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-rpm, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # the "## [VER]" section, up to the next "## " heading
          awk -v v="## [$VER]" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          | File | Platform |
          |---|---|
          | `Steam_Grunge_Editor-*-x86_64.AppImage` | Any Linux distro (`chmod +x`, then run it) |
          | `steam-grunge-editor_*_amd64.deb` | Ubuntu, Debian, Mint: `sudo apt install ./steam-grunge-editor_*_amd64.deb` |
          | `steam-grunge-editor-*.x86_64.rpm` | Fedora: `sudo dnf install ./steam-grunge-editor-*.rpm` · Bazzite: `rpm-ostree install ./…rpm` |
          | `SteamGrungeEditor-*-Setup.exe` | Windows 10/11 |
          | `Steam_Grunge_Editor-*-arm64.dmg` | macOS 11+ on Apple Silicon — first launch: right-click → Open (unsigned) |

          Verify: `sha256sum -c SHA256SUMS.txt`
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Steam Grunge Editor ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
